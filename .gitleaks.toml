# gitleaks configuration.
#
# The end-to-end tests stand up a local, throwaway MCP server and drive the
# proxy against it with a hard-coded *dummy* credential (e.g. the api-key test
# uses `API_KEY = "test-api-key-abc123"`). These are non-secret test fixtures,
# not real credentials, so gitleaks' generic "api-key" heuristic is a false
# positive here. Exempt only these obvious test-fixture patterns.
#
# Rule: only exempt strings confirmed to be public / non-secret. Real secrets
# must be removed and rotated, never masked with an allowlist.

[extend]
useDefault = true

[allowlist]
description = "Dummy, non-secret credentials used only by the end-to-end tests."
regexes = [
  '''test-api-key-[A-Za-z0-9]+''',
]
